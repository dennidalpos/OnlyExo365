name: release-signed

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag that should receive the signed assets.
        required: false
        type: string
  release:
    types:
      - published

jobs:
  signed-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target release tag
        id: release_tag
        shell: pwsh
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          . ./build/helpers/release-tag.ps1
          $tag = Resolve-ReleaseTag -EventName $env:RELEASE_EVENT -PublishedTag $env:PUBLISHED_TAG -RequestedTag $env:REQUESTED_TAG
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate signing secrets
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "Missing GitHub secret WINDOWS_SIGNING_PFX_BASE64."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "Missing GitHub secret WINDOWS_SIGNING_PFX_PASSWORD."
          }

      - name: Run shared Windows release baseline
        uses: ./.github/actions/windows-release-baseline

      - name: Materialize signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "onlyexo365-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "SIGNING_CERT_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign release payload
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: >
          ./build/sign-artifacts.ps1
          -Path artifacts/publish
          -CertificatePath "$env:SIGNING_CERT_PATH"
          -CertificatePassword "$env:SIGNING_PFX_PASSWORD"

      - name: Package signed payload
        shell: pwsh
        run: ./build/create-setup-exe.ps1 -PublishPath artifacts/publish -OutputDirectory artifacts/packages -OutputFileName OnlyExo365.Setup.exe -ProductName OnlyExo365

      - name: Sign setup EXE
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: >
          ./build/sign-artifacts.ps1
          -Path artifacts/packages/OnlyExo365.Setup.exe
          -CertificatePath "$env:SIGNING_CERT_PATH"
          -CertificatePassword "$env:SIGNING_PFX_PASSWORD"

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_SHA1 }}
        run: |
          $arguments = @(
            "-File", "./build/verify-signatures.ps1",
            "-Path", "artifacts/publish", "artifacts/packages"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_THUMBPRINT)) {
            $arguments += "-ExpectedThumbprint", $env:EXPECTED_SIGNER_THUMBPRINT
          }

          & pwsh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run publish and setup EXE smoke tests
        shell: pwsh
        run: ./build/run-smoke-tests.ps1 -PublishPath artifacts/publish -SetupExePath artifacts/packages/OnlyExo365.Setup.exe -ReportPath artifacts/smoke/smoke-report.json

      - name: Prepare durable release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: >
          ./scripts/agents/publish.ps1
          -ReleaseTag "$env:RELEASE_TAG"
          -OutputDirectory artifacts/publish/release-assets

      - name: Upload signed assets to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: >
          gh release upload "$env:RELEASE_TAG"
          "$env:RELEASE_ASSET_ZIP"
          "$env:RELEASE_ASSET_SETUP_EXE"
          "$env:RELEASE_ASSET_CHECKSUMS"
          "$env:RELEASE_ASSET_MANIFEST"
          --clobber

      - name: Upload signed publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64-signed
          path: artifacts/publish/**
          if-no-files-found: error

      - name: Upload signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64-signed
          path: artifacts/packages/**
          if-no-files-found: error

      - name: Upload release assets bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-signed
          path: artifacts/publish/release-assets/**
          if-no-files-found: error

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-signed
          path: artifacts/security/**
          if-no-files-found: error

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-signed
          path: artifacts/smoke/**
          if-no-files-found: error
