name: release-tenant-validation

on:
  workflow_dispatch:
    inputs:
      skip_graph:
        description: Skip Microsoft Graph validation and run Exchange-only probes.
        required: false
        default: false
        type: boolean

jobs:
  tenant-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json

      - name: Run canonical doctor
        shell: pwsh
        run: ./scripts/doctor.ps1

      - name: Validate tenant-validation secrets
        shell: pwsh
        env:
          ONLYEXO365_APP_ID: ${{ secrets.ONLYEXO365_APP_ID }}
          ONLYEXO365_EXO_ORGANIZATION: ${{ secrets.ONLYEXO365_EXO_ORGANIZATION }}
          ONLYEXO365_GRAPH_TENANT_ID: ${{ secrets.ONLYEXO365_GRAPH_TENANT_ID }}
          ONLYEXO365_CERT_THUMBPRINT: ${{ secrets.ONLYEXO365_CERT_THUMBPRINT }}
          ONLYEXO365_CERTIFICATE_PFX_BASE64: ${{ secrets.ONLYEXO365_CERTIFICATE_PFX_BASE64 }}
          ONLYEXO365_CERTIFICATE_PFX_PASSWORD: ${{ secrets.ONLYEXO365_CERTIFICATE_PFX_PASSWORD }}
        run: |
          $required = @(
            "ONLYEXO365_APP_ID",
            "ONLYEXO365_EXO_ORGANIZATION",
            "ONLYEXO365_CERT_THUMBPRINT",
            "ONLYEXO365_CERTIFICATE_PFX_BASE64",
            "ONLYEXO365_CERTIFICATE_PFX_PASSWORD"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing GitHub secret $name."
            }
          }

          if (-not [bool]::Parse('${{ inputs.skip_graph }}') -and [string]::IsNullOrWhiteSpace($env:ONLYEXO365_GRAPH_TENANT_ID)) {
            throw "Missing GitHub secret ONLYEXO365_GRAPH_TENANT_ID required for Graph validation."
          }

      - name: Import certificate in CurrentUser store
        shell: pwsh
        env:
          ONLYEXO365_CERTIFICATE_PFX_BASE64: ${{ secrets.ONLYEXO365_CERTIFICATE_PFX_BASE64 }}
          ONLYEXO365_CERTIFICATE_PFX_PASSWORD: ${{ secrets.ONLYEXO365_CERTIFICATE_PFX_PASSWORD }}
          ONLYEXO365_CERT_THUMBPRINT: ${{ secrets.ONLYEXO365_CERT_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "onlyexo365-tenant-validation.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:ONLYEXO365_CERTIFICATE_PFX_BASE64))

          $securePassword = ConvertTo-SecureString $env:ONLYEXO365_CERTIFICATE_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -Password $securePassword -CertStoreLocation Cert:\CurrentUser\My -Exportable

          if ($null -eq $certificate) {
            throw "Unable to import the tenant validation certificate."
          }

          if ($certificate.Thumbprint -ne $env:ONLYEXO365_CERT_THUMBPRINT) {
            throw "Imported certificate thumbprint mismatch. Expected $($env:ONLYEXO365_CERT_THUMBPRINT), actual $($certificate.Thumbprint)."
          }

      - name: Run Exchange and Graph tenant validation
        shell: pwsh
        env:
          ONLYEXO365_AUTH_MODE: AppCertificate
          ONLYEXO365_APP_ID: ${{ secrets.ONLYEXO365_APP_ID }}
          ONLYEXO365_EXO_ORGANIZATION: ${{ secrets.ONLYEXO365_EXO_ORGANIZATION }}
          ONLYEXO365_GRAPH_TENANT_ID: ${{ secrets.ONLYEXO365_GRAPH_TENANT_ID }}
          ONLYEXO365_CERT_THUMBPRINT: ${{ secrets.ONLYEXO365_CERT_THUMBPRINT }}
          ONLYEXO365_ENABLE_GRAPH: 1
          ONLYEXO365_GRAPH_SCOPES: Organization.Read.All;Directory.Read.All;RoleManagement.Read.Directory;User.Read.All
        run: |
          $arguments = @(
            "-File", "./build/run-tenant-validation.ps1",
            "-ReportPath", "artifacts/tenant-validation/tenant-validation-report.json"
          )

          if ([bool]::Parse('${{ inputs.skip_graph }}')) {
            $arguments += "-SkipGraph"
          }

          & pwsh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Remove certificate from CurrentUser store
        if: always()
        shell: pwsh
        env:
          ONLYEXO365_CERT_THUMBPRINT: ${{ secrets.ONLYEXO365_CERT_THUMBPRINT }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:ONLYEXO365_CERT_THUMBPRINT)) {
            Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $env:ONLYEXO365_CERT_THUMBPRINT | Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Upload tenant validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-validation-report
          path: artifacts/tenant-validation/**
          if-no-files-found: error

